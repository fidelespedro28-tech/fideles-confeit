<head>

  <meta name="description"
    content="A página que você está procurando não existe ou mudou de endereço. Volte para a página inicial da FIDELES CONFEITARIA ou fale com a Mônica pelo WhatsApp.">
  <link rel="canonical" href="https://fidelesconfeitaria.online/404.html">

  <!-- Favicon -->

  <!-- Resource Hints & Google Fonts (display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"

  <style>
    :root {
      --bg-warm: #FAF6F4;
      --bg-surface: #FFFFFF;
      --bg-pink-blush: #FFF2F5;
      --primary-wine: #8a0433;
      --primary-wine-text: #80032e;
      --text-main: #2D1B22;
      --text-muted: #6E535E;
      --accent-wine-border: rgba(138, 4, 51, 0.18);
      --font-display: 'Oswald', sans-serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --shadow-card: 0 10px 28px -6px rgba(138, 4, 51, 0.09);
      --shadow-pink-glow: 0 8px 22px rgba(138, 4, 51, 0.26);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-warm);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 24px;
      text-align: center;
      overflow-x: hidden !important;
    }

    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--accent-wine-border);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .brand-eyebrow {
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.875rem;
      color: var(--primary-wine);
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--bg-pink-blush);
      border: 1px solid rgba(138, 4, 51, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--primary-wine);
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 8vw, 5rem);
      line-height: 1;
      font-weight: 700;
      color: var(--primary-wine);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .actions-grid {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 9999px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary-wine);
      color: #FFFFFF;
      box-shadow: var(--shadow-pink-glow);
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      background: #73032a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary-wine-text);
      border: 1.5px solid var(--accent-wine-border);
    }

    .btn-secondary:hover {
      background: var(--bg-pink-blush);
      border-color: var(--primary-wine);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <main class="error-card">
    <div class="brand-eyebrow">
      <span>FIDELES CONFEITARIA</span>

    <div class="error-code">404</div>

      O endereço que você tentou acessar não existe ou foi alterado. Mas não se preocupe: as encomendas e os bolos artesanais da Mônica continuam a todo vapor!

    <div class="actions-grid">
      <a href="/" class="btn btn-primary" aria-label="Voltar para a página inicial da Fideles Confeitaria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

        aria-label="Falar com a Mônica pelo WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
